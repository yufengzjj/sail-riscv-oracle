[package]
name = "sail-riscv-oracle"
version = "0.1.0"
edition = "2021"
description = "Rust FFI oracle around the Sail RISC-V model (sail -> C++ -> Rust) for differential testing"
# Own code is BSD-3-Clause; the compound expression reflects the vendored,
# statically-linked components (see LICENSE). mini-gmp is the copyleft part.
license = "BSD-3-Clause AND BSD-2-Clause AND MIT AND (LGPL-3.0-or-later OR GPL-2.0-or-later)"
build = "build.rs"
# `links` makes Cargo enforce a single version of the native lib per build graph,
# which matches the reality that the Sail runtime is global per-process state.
links = "sailriscv"

[features]
default = []
# Link the system libgmp instead of the bundled mini-gmp. Auto-discovered: GMP_DIR
# env, else a scan of PATH for a prefix with include/gmp.h + a gmp lib, else the
# toolchain's default search paths. Equivalent to setting SAIL_SYSTEM_GMP=1.
system-gmp = []
# Same, but link libgmp statically (no runtime gmp DLL/.so to ship).
system-gmp-static = ["system-gmp"]

[build-dependencies]
cc = "1"
# Pure-Rust gzip (miniz_oxide backend) to unpack vendor/sail_riscv_model.cpp.gz.
flate2 = "1"

[lib]
name = "sail_riscv_oracle"
path = "src/lib.rs"
